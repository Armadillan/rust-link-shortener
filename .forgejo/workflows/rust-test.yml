name: Rust tests

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  test:
    runs-on: ubuntu
    strategy:
      fail-fast: false
      matrix:
        # Add more entries (e.g. 1.75) to test against other toolchains.
        toolchain: [stable, beta]
        # "debug" is a plain `cargo test`; "release" adds --release.
        profile: [debug, release]
    env:
      # Empty for debug, "--release" for release. Used unquoted below so an
      # empty value expands to nothing.
      PROFILE_FLAG: ${{ matrix.profile == 'release' && '--release' || '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal \
                --default-toolchain "${{ matrix.toolchain }}" \
                --component rustfmt,clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Show versions
        run: |
          rustc --version
          cargo --version

      - name: Cache cargo registry and build output
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          # The profile is part of the key so the debug and release jobs for
          # the same toolchain don't fight over one cache entry.
          key: cargo-${{ matrix.toolchain }}-${{ matrix.profile }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ matrix.toolchain }}-${{ matrix.profile }}-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features $PROFILE_FLAG -- -D warnings

      - name: Build tests
        run: cargo test --workspace --all-features $PROFILE_FLAG --no-run

      - name: Run tests
        run: cargo test --workspace --all-features $PROFILE_FLAG